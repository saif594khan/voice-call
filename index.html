<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Voice Call App</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background-color: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0051a2; }
    button.answer-btn { background-color: #28a745; display: none; }
    button.answer-btn:hover { background-color: #218838; }
    button.end-btn { background-color: #dc3545; display: none; }
    button.end-btn:hover { background-color: #bd2130; }
    .status { font-weight: bold; padding: 10px; background: #f0f0f0; border-radius: 4px; text-align: center; }
  </style>
</head>
<body>

  <h2>Web Voice Caller</h2>

  <div>
    <label>Your Email:</label>
    <input type="email" id="myEmail" placeholder="e.g. user1@gmail.com">
    <button onclick="saveAndRegister()">Save Email / Connect</button>
  </div>

  <hr>

  <div>
    <label>Recipient's Email:</label>
    <input type="email" id="receiverEmail" placeholder="e.g. user2@gmail.com">
    <button onclick="startVoiceCall()" id="callBtn">Call User</button>
    <button onclick="answerIncomingCall()" id="answerBtn" class="answer-btn">Answer Call 📞</button>
    <button onclick="endCall()" id="endBtn" class="end-btn">End Call</button>
  </div>

  <br>
  <div class="status" id="statusText">Status: Initializing...</div>

  <audio id="remoteAudio" autoplay playsinline></audio>
  <audio id="ringtoneAudio" src="lululu-ringtone.mp3" loop preload="auto"></audio>

<script>
  let peer = null;
  let localAudioStream = null;
  let activeCall = null;
  let pendingIncomingCall = null;
  let wakeLock = null;

  const ringtone = document.getElementById('ringtoneAudio');

  function startRingtone() {
    ringtone.currentTime = 0;
    ringtone.play().catch(err => console.log("Ringtone playback blocked:", err));
  }

  function stopRingtone() {
    ringtone.pause();
    ringtone.currentTime = 0;
  }

  navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    .then(stream => { localAudioStream = stream; })
    .catch(err => console.log("Microphone access required."));

  function sanitizeId(email) {
    return email.replace(/[^a-zA-Z0-9]/g, "_");
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {
      console.log('Wake lock error:', err.message);
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().then(() => { wakeLock = null; });
    }
  }

  // Auto-connect on app launch
  window.addEventListener('DOMContentLoaded', () => {
    const savedEmail = localStorage.getItem('userEmail');
    if (savedEmail) {
      document.getElementById('myEmail').value = savedEmail;
      connectPeer(savedEmail);
    } else {
      document.getElementById('statusText').innerText = "Status: Enter email to register";
    }
  });

  // Re-connect WebSocket automatically if Android drops background connection
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && peer && peer.disconnected) {
      console.log("App foregrounded: Reconnecting PeerJS...");
      peer.reconnect();
    }
  });

  function saveAndRegister() {
    const email = document.getElementById('myEmail').value.trim().toLowerCase();
    if (!email) return alert("Enter your email address!");
    localStorage.setItem('userEmail', email);
    connectPeer(email);
  }

  function connectPeer(email) {
    if (peer) peer.destroy();

    const cleanId = sanitizeId(email);

    peer = new Peer(cleanId, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', () => {
      document.getElementById('statusText').innerText = "Online as: " + email;
      document.getElementById('statusText').style.background = "#d4edda";
    });

    // Handle WebSocket Disconnection: auto-reconnect instead of closing
    peer.on('disconnected', () => {
      console.log("PeerJS disconnected. Attempting auto-reconnect...");
      if (peer && !peer.destroyed) {
        peer.reconnect();
      }
    });

    peer.on('call', (incomingCall) => {
      pendingIncomingCall = incomingCall;

      startRingtone();
      document.getElementById('statusText').innerText = "Incoming Call...";
      document.getElementById('statusText').style.background = "#fff3cd";
      document.getElementById('callBtn').style.display = "none";
      document.getElementById('answerBtn').style.display = "block";
      document.getElementById('endBtn').style.display = "block";
    });

    peer.on('error', (err) => {
      console.error(err);
      stopRingtone();
      if (err.type === 'peer-unavailable') {
        alert("Recipient is offline or email address is incorrect!");
        resetCallUI();
      }
    });
  }

  function answerIncomingCall() {
    if (!pendingIncomingCall) return;

    stopRingtone();
    activeCall = pendingIncomingCall;
    pendingIncomingCall = null;

    activeCall.answer(localAudioStream);

    activeCall.on('stream', (remoteStream) => {
      setupCallUI(remoteStream);
    });

    activeCall.on('close', () => resetCallUI());
  }

  function startVoiceCall() {
    if (!peer || peer.disconnected) {
      if (peer) peer.reconnect();
      return alert("Connecting to server... please try calling again in a moment.");
    }

    const receiverEmail = document.getElementById('receiverEmail').value.trim().toLowerCase();
    if (!receiverEmail) return alert("Type recipient email first!");

    const targetId = sanitizeId(receiverEmail);
    activeCall = peer.call(targetId, localAudioStream);

    document.getElementById('statusText').innerText = "Calling " + receiverEmail + "...";

    if (activeCall) {
      activeCall.on('stream', (remoteStream) => {
        setupCallUI(remoteStream);
      });

      activeCall.on('close', () => resetCallUI());
    }
  }

  function setupCallUI(remoteStream) {
    stopRingtone();

    const audioElement = document.getElementById('remoteAudio');
    audioElement.srcObject = remoteStream;
    audioElement.play();

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Voice Call Active',
        artist: 'Web Voice Caller'
      });
      navigator.mediaSession.playbackState = 'playing';
    }

    document.getElementById('statusText').innerText = "Status: Connected & Talking!";
    document.getElementById('statusText').style.background = "#cce5ff";
    document.getElementById('callBtn').style.display = "none";
    document.getElementById('answerBtn').style.display = "none";
    document.getElementById('endBtn').style.display = "block";

    requestWakeLock();
  }

  function endCall() {
    if (pendingIncomingCall) {
      pendingIncomingCall.close();
      pendingIncomingCall = null;
    }
    if (activeCall) {
      activeCall.close();
    }
    resetCallUI();
  }

  function resetCallUI() {
    stopRingtone();
    activeCall = null;
    pendingIncomingCall = null;
    document.getElementById('remoteAudio').srcObject = null;
    document.getElementById('callBtn').style.display = "block";
    document.getElementById('answerBtn').style.display = "none";
    document.getElementById('endBtn').style.display = "none";
    
    const savedEmail = localStorage.getItem('userEmail');
    document.getElementById('statusText').innerText = savedEmail ? "Online as: " + savedEmail : "Status: Offline";
    document.getElementById('statusText').style.background = savedEmail ? "#d4edda" : "#f0f0f0";

    releaseWakeLock();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = 'none';
    }
  }
</script>
</body>
</html>
